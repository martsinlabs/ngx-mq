name: Bug report
description: Report a problem with ngx-mq
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please fill in the sections below so we can
        reproduce and fix the issue quickly.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: input
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: A link to a StackBlitz or repository that reproduces the issue.
      placeholder: https://stackblitz.com/edit/...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened. Include any console errors.
    validations:
      required: true

  - type: input
    id: ngx-mq-version
    attributes:
      label: ngx-mq version
      placeholder: 3.0.0
    validations:
      required: true

  - type: input
    id: angular-version
    attributes:
      label: Angular version
      placeholder: 20.3.0
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that might help (SSR, zoneless, browser, etc.).
    validations:
      required: false
