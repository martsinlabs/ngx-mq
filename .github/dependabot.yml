version: 2
updates:
  # Library dependencies
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  # Demo app dependencies
  - package-ecosystem: npm
    directory: /demo
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      demo-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
